name: CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Python Quality & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Ruff Lint
        run: python -m ruff check .

      - name: Ruff Format
        run: python -m ruff format --check .

      - name: Run Pytest
        run: python -m pytest -v

  docker:
    name: Docker Build & FFmpeg
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t backend-ci .

      - name: Verify FFmpeg
        run: docker run --rm --entrypoint ffmpeg backend-ci -version

      - name: Verify FFprobe
        run: docker run --rm --entrypoint ffprobe backend-ci -version
